name: Release binaries

# Cross-compiles the four server binaries per platform and attaches the archives
# + SHA-256 checksums to the GitHub Release for the pushed vX.Y.Z tag. See issue #15.
#
# Pipeline (per merge to main): CI gate (#14) -> SemVer bump + tag push (#13,
# release.yml) -> THIS workflow. It fires on the tag push because:
#   * release.yml pushes the tag with RELEASE_PAT, and a PAT push triggers
#     downstream workflows (the default GITHUB_TOKEN would not), and
#   * the tagged bump commit is deliberately NOT marked [skip ci] (which would
#     suppress this tag-push run as well).
# The matching Release is normally already created (notes-only) by release.yml;
# this workflow attaches the binaries to it idempotently.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build + attach binaries for, e.g. v0.1.1"
        required: true

# Per-tag group so re-runs/dispatches for one tag serialize, while different tags
# don't block each other. Distinct from release.yml's "release" group.
concurrency:
  group: release-binaries-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Least privilege: build jobs only read; the aggregator job is granted write.
permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-apple-darwin,     os: macos-latest }
          - { target: x86_64-apple-darwin,      os: macos-latest }
          - { target: x86_64-pc-windows-msvc,   os: windows-latest }
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout at the tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Install pinned toolchain + target
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # No `toolchain:` -> honors rust-toolchain.toml (1.95.0); add the matrix target.
          target: ${{ matrix.target }}
          # rustflags:"" relaxes the action's default -D warnings; warning-gating lives in ci.yml.
          rustflags: ""
          cache: false

      - name: Cache cargo + target (per target)
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries (lobby/map/web/world-server)
        run: cargo build --release --workspace --bins --locked --target ${{ matrix.target }}

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          target="${{ matrix.target }}"
          src="target/$target/release"
          stage="garlemald-server-$tag-$target"
          mkdir -p "$stage" dist
          for b in lobby-server map-server web-server world-server; do
            cp "$src/$b" "$stage/"
          done
          tar -czf "dist/$stage.tar.gz" "$stage"
          # sha256sum on Linux; macOS only ships shasum.
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$stage.tar.gz" > "$stage.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "$stage.tar.gz" > "$stage.tar.gz.sha256")
          fi
          ls -l dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.tag.outputs.tag }}"
          $target = "${{ matrix.target }}"
          $src = "target\$target\release"
          $stage = "garlemald-server-$tag-$target"
          New-Item -ItemType Directory -Force -Path $stage, dist | Out-Null
          foreach ($b in "lobby-server","map-server","web-server","world-server") {
            Copy-Item "$src\$b.exe" "$stage\"
          }
          Compress-Archive -Path $stage -DestinationPath "dist\$stage.zip" -Force
          # Match the `<hash>  <file>` shape (lowercase, two spaces) so `sha256sum -c` works.
          $h = (Get-FileHash "dist\$stage.zip" -Algorithm SHA256).Hash.ToLower()
          # LF-only, no BOM, so `sha256sum -c` on Linux accepts it (matches the unix legs).
          [IO.File]::WriteAllText("dist\$stage.zip.sha256", "$h  $stage.zip`n")
          Get-ChildItem dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: attach to release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach assets to the GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          echo "Assets to attach:"; ls -l dist
          # release.yml usually created the (notes-only) release already; create if
          # missing (e.g. a workflow_dispatch rebuild) — --verify-tag refuses to
          # fabricate a tag.
          # The trailing `view` tolerates a create that lost a rare race with
          # release.yml (both creating the same tag -> 422 already_exists).
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes --verify-tag \
            || gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          # --clobber replaces same-named assets so re-runs are idempotent.
          gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          echo "Attached $(ls dist | wc -l) files to release $tag"

      - name: Announce the release on Discord
        # Only on a real tagged release (push), not manual workflow_dispatch rebuilds,
        # so backfilling assets for an old tag doesn't re-announce it as "new".
        if: github.event_name == 'push'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          PROJECT: Garlemald Server
          TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "::warning::DISCORD_RELEASE_WEBHOOK_URL secret is not set — skipping the Discord announcement."
            exit 0
          fi
          # Build the JSON with jq (--arg escapes every value) so the tag can never
          # break out of the shell or the JSON payload.
          payload="$(jq -n \
            --arg project "$PROJECT" \
            --arg tag "$TAG" \
            --arg url "$RELEASE_URL" \
            '{
              username: ($project + " Releases"),
              embeds: [{
                title: ($project + " " + $tag),
                description: ("A new " + $project + " release is available: " + $tag + "."),
                url: $url,
                color: 12595755
              }]
            }')"
          # A notification failure must not fail the release (binaries are already attached).
          if curl -fsS -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d "$payload"; then
            echo "Announced $TAG to Discord."
          else
            echo "::warning::Discord announcement for $TAG failed (webhook unreachable or rejected)."
          fi
